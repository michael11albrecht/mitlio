# Backend gate (docs/IMPLEMENTATION_PLAN.md §6.1, P6-T01..T03). Local Docker is not available on
# dev machines, so every database check runs here. The Supabase CLI is pinned to an exact
# version; bump it deliberately (and update supabase/README.md).
name: db
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    name: db (migrations, rls, pgtap, squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.70.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4
      - name: Edge Functions (fmt, lint, type-check)
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check fuel-prices/index.ts fx-rates/index.ts tests/*.ts _shared/*.ts
      - name: Edge Functions unit tests (coverage >= 90 %)
        run: supabase/functions/tests/coverage_gate.sh
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from scratch
        run: supabase db reset
      - name: pgTAP (schema + RLS)
        run: supabase test db
      - name: Edge Function integration test (functions serve + provider stub)
        run: supabase/functions/tests/run_integration.sh
      - name: TS types are up to date
        run: |
          supabase gen types typescript --local > supabase/types/database.ts
          git --no-pager diff --exit-code -- supabase/types/database.ts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Dart DB contract is up to date
        run: |
          dart tool/gen_db_contract.dart
          git --no-pager diff --exit-code -- app/lib/features/sync/data/db_contract.g.dart
      - name: Lint migrations (squawk)
        if: ${{ !cancelled() }}
        run: make db-lint
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
