# CI gates (docs/IMPLEMENTATION_PLAN.md §6.1). Job `name:` values are the required-check names
# for branch protection: do not rename them without updating the ruleset.
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (fmt, lint, arch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: make bootstrap
      - run: make fmt-check
      - run: make lint
      - run: make arch
      - run: make deps-policy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: make bootstrap
      - run: make test
      - run: make domain-web-test

  goldens:
    name: goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # golden-diff comment (same-repo PRs only)
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: make bootstrap
      - run: make goldens
      - name: Upload golden failure diffs
        id: upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 14
      # One comment per PR, updated in place. Forks get a read-only token, so skip them.
      - name: Comment golden diff summary on PR
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- mitlio-golden-diff -->'
          count=$(find app/test -path '*/failures/*.png' 2>/dev/null | wc -l | tr -d ' ')
          if [ -n "$ARTIFACT_URL" ]; then
            link="[golden-failures artifact]($ARTIFACT_URL)"
          else
            link="no diff images were produced (see the [run]($RUN_URL))"
          fi
          cat > comment.md <<EOF
          $marker
          **Golden tests failed** on \`${GITHUB_SHA::7}\`: $count diff image(s), $link.
          Download the artifact to see the diff images, then either fix the UI or update the goldens (\`make goldens-update\`) and explain why in the PR body. Run: $RUN_URL
          EOF
          # Edit the existing comment (marker) if any, else create one.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"${marker}\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download main's coverage summary artifact
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: make bootstrap
      # On PRs fetch the latest main summary as ratchet baseline (P1-T02 gate reads coverage-baseline/summary.txt).
      # Missing baseline (first run, expired artifact) is fine.
      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name coverage-summary --dir coverage-baseline || echo "no baseline artifact"
          else
            echo "no successful main run yet"
          fi
      - run: make cov
      - name: Write coverage summary
        if: always()
        run: |
          mkdir -p coverage-summary
          {
            echo "sha=${GITHUB_SHA}"
            # Total line coverage over every lcov.info the gate produced (empty until P1-T02 lands).
            find . -name lcov.info -not -path './coverage-baseline/*' -print0 \
              | xargs -0 -r cat \
              | awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "lines_found=%d\nlines_hit=%d\nline_coverage=%.2f\n", lf, lh, 100*lh/lf; else print "no lcov data" }'
          } | tee coverage-summary/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary/
          retention-days: 30

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binary instead of gitleaks-action (the action needs a license key for org repos).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: make secrets

  osv:
    name: osv (pubspec.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        env:
          OSV_VERSION: 2.0.2
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --lockfile=pubspec.lock

  # Not a required check (PW-T02). Builds web/ and runs Lighthouse CI (>= 0.95 per category).
  web:
    name: web (astro, lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # no .tool-versions yet: Node 22 LTS
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run lhci
