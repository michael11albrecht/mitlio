# Firebase Hosting for the SEO site (PW-T10, docs/hosting.md). Preview channel per PR (the action comments
# the preview URL on the PR), live deploy on push to main. Needs the repo secret FIREBASE_SERVICE_ACCOUNT
# (service account JSON with "Firebase Hosting Admin"); without it (or on fork PRs) the job is skipped.
# Optional repo variables used at build time: SITE_URL, FUEL_API_URL, FUEL_API_ANON_KEY, APP_STORE_URL,
# PLAY_STORE_URL, APPLE_TEAM_ID, ANDROID_SHA256_CERT_FINGERPRINTS, ROUTE_WEB (see web/site.config.mjs).
# LEGAL_STREET and LEGAL_CITY hold the operator's postal address for the Impressum / Datenschutzerklärung. They
# are repo variables so the address never enters the (public) repository; if one is unset, the legal text keeps
# its placeholder and the production build fails (docs/release.md, "Legal texts").
# LEGAL_STRICT=1 arms that gate even while SITE_URL is unset (stand-in origin https://mitlio.web.app, which this
# workflow deploys live): a missing LEGAL_STREET / LEGAL_CITY then fails the build instead of publishing placeholders.
name: web-deploy
on:
  pull_request:
    paths:
      - "web/**"
      - "packages/domain/**"
      - "packages/domain_web/**"
      - ".github/workflows/web-deploy.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/domain/**"
      - "packages/domain_web/**"
      - ".github/workflows/web-deploy.yml"

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (firebase hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs get no secrets, so they are skipped as well.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # preview URL comment
      checks: write # the action reports a check run
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      SITE_URL: ${{ vars.SITE_URL }}
      LEGAL_STRICT: "1"
      LEGAL_STREET: ${{ vars.LEGAL_STREET }}
      LEGAL_CITY: ${{ vars.LEGAL_CITY }}
      FUEL_API_URL: ${{ vars.FUEL_API_URL }}
      FUEL_API_ANON_KEY: ${{ vars.FUEL_API_ANON_KEY }}
      ROUTE_WEB: ${{ vars.ROUTE_WEB }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_SHA256_CERT_FINGERPRINTS }}
    steps:
      - name: Skip notice
        if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE_SECRET == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE_SECRET == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Same build as the ci.yml web job: the calculator island needs mitlio_domain.js (Dart prebuild).
      - uses: subosito/flutter-action@v2
        if: env.HAS_FIREBASE_SECRET == 'true'
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
        if: env.HAS_FIREBASE_SECRET == 'true'
      - run: npm ci
        if: env.HAS_FIREBASE_SECRET == 'true'
        working-directory: web
      - run: npm run build
        if: env.HAS_FIREBASE_SECRET == 'true'
        working-directory: web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SECRET == 'true' && github.event_name == 'pull_request'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mitlio
          entryPoint: web
          expires: 7d
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SECRET == 'true' && github.event_name == 'push'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mitlio
          entryPoint: web
          channelId: live
