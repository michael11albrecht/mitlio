# Auto-merge for `safe` PRs (P8-T07), enabled by the owner on 2026-11-20 (before the >= 20 reviewed
# PRs bar in the plan; owner decision). Squash auto-merge only completes once branch protection is
# satisfied (required checks green). Runs on pull_request_target and never checks out PR code.
# Same-repo branches only: fork PRs are never auto-merged. `critical` PRs have auto-merge switched off.
name: automerge
on:
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Enable auto-merge (safe, same-repo, not draft, not critical)
        if: >-
          contains(github.event.pull_request.labels.*.name, 'safe') &&
          !contains(github.event.pull_request.labels.*.name, 'critical') &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
      - name: Disable auto-merge (critical or no longer safe)
        if: >-
          contains(github.event.pull_request.labels.*.name, 'critical') ||
          !contains(github.event.pull_request.labels.*.name, 'safe')
        run: gh pr merge "$PR" --disable-auto --repo "$GITHUB_REPOSITORY" || echo "auto-merge was not enabled"
