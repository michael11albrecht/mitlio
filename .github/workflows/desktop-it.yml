# Desktop integration tests (docs/IMPLEMENTATION_PLAN.md P1-T09): the Linux runner under xvfb is the
# headless harness for integration tests and DebugDrive. Not a required check until the owner adds it.
name: desktop-it
on:
  pull_request:
    paths:
      - "app/**"
      - "packages/drive_client/**"
      - "tool/drive.sh"
      - "tool/check_release_strip.sh"
      - ".github/workflows/desktop-it.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/drive_client/**"
      - "tool/drive.sh"
      - "tool/check_release_strip.sh"
      - ".github/workflows/desktop-it.yml"

concurrency:
  group: desktop-it-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-it:
    name: desktop-it
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev xvfb
      - run: make bootstrap
      - run: make it
      - name: DebugDrive ping (debug app under xvfb)
        run: |
          make drive-up
          tool/drive.sh ext.mitlio.ping | tee ping.json
          jq -e '.version and .buildSha' ping.json
          make drive-down
      - name: DebugDrive app log
        if: failure()
        run: tail -n 100 .drive/run.log || true
      - name: Release build contains no DebugDrive
        run: |
          cd app && flutter build linux --release
          cd .. && tool/check_release_strip.sh
      # P8-T06 proof that the gate bites: remove the kDebugMode guard, rebuild, the check must fail.
      - name: Release build without the kDebugMode guard is caught
        run: |
          grep -q '^  if (kDebugMode) registerDebugDrive(container);$' app/lib/main.dart
          sed -i 's/^  if (kDebugMode) registerDebugDrive(container);$/  registerDebugDrive(container);/' app/lib/main.dart
          (cd app && flutter build linux --release)
          if tool/check_release_strip.sh; then
            echo "::error::check_release_strip.sh passed although the kDebugMode guard was removed"
            exit 1
          fi
