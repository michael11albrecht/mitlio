# Desktop integration tests (docs/IMPLEMENTATION_PLAN.md P1-T09): the Linux runner under xvfb is the
# headless harness for integration tests and DebugDrive. Not a required check until the owner adds it.
name: desktop-it
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/desktop-it.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/desktop-it.yml"

concurrency:
  group: desktop-it-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-it:
    name: desktop-it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: make bootstrap
      - run: make it
