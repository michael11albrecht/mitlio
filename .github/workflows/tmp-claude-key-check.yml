# TEMPORARY: verifies the ANTHROPIC_API_KEY secret. Removed again before merge of #185.
name: tmp-claude-key-check
on:
  pull_request:
    paths: [".github/workflows/tmp-claude-key-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Messages API
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::ANTHROPIC_API_KEY is empty"; exit 1; fi
          code=$(curl -sS -o resp.json -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-haiku-5-5","max_tokens":8,"messages":[{"role":"user","content":"Say ok"}]}')
          echo "HTTP $code"
          jq -r '.error // {type:"none"} | "error.type=\(.type) message=\(.message // "-")", ""' resp.json | head -3
          jq -r '"usage: \(.usage // "n/a")"' resp.json
          [ "$code" = 200 ]
