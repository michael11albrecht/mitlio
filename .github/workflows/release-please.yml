# Opens/updates the release PR from conventional commits (P8-T05). Merging the release PR tags
# `mitlio-vX.Y.Z` and creates a GitHub release (no store upload happens here).
# The GitHub App token (same App as agent-implement) is used so CI runs on the release PR;
# GITHUB_TOKEN-created PRs do not trigger workflows. The App needs contents + pull-requests write.
# app/pubspec.yaml is bumped by the generic updater on the `x-release-please-version` line only
# (comments survive); it carries no `+build` suffix, CI passes --build-number instead.
name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # writes go through the App token

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GitHub App token
        id: app
        uses: actions/create-github-app-token@v1.12.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_KEY }}
      - uses: googleapis/release-please-action@v4.4.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
