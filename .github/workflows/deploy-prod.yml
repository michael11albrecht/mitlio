# Production backend deploy (project mitlio-prod). Manual only: run from main via workflow_dispatch;
# the GitHub environment `production` holds the secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
# SUPABASE_DB_PASSWORD) and should require a manual approval. Keep the CLI version in sync with
# deploy-dev.yml and db.yml. Never trigger from pull_request / pull_request_target.
name: deploy-prod
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    name: deploy-production (migrations + edge functions)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # actions/checkout v4.2.2, supabase/setup-cli v1.7.3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.2.0
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dry run (pending migrations)
        run: |
          {
            echo '## supabase db push --dry-run'
            echo '```'
            supabase db push --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply migrations
        run: supabase db push --yes
      - name: Deploy Edge Functions
        run: |
          # Every directory with an index.ts; _shared and tests hold no entry point.
          # No [functions.*] block in config.toml, so verify_jwt keeps its default (true):
          # clients and pg_cron call with the anon key as bearer token.
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ -f "${dir}index.ts" ] || continue
            echo "Deploying $name"
            supabase functions deploy "$name" --use-api
          done
      - name: Set fuel-prices CORS allowlist (public web origins, not a secret)
        env:
          # The web calculator calls fuel-prices from the browser; without an allowed origin the
          # preflight has no Access-Control headers and the browser blocks the request.
          # Override with the repo/environment variable FUEL_ALLOWED_ORIGINS (e.g. once the domain is live).
          FUEL_ALLOWED_ORIGINS: ${{ vars.FUEL_ALLOWED_ORIGINS || 'https://mitlio.web.app,https://mitlio.de,https://www.mitlio.de' }}
        run: supabase secrets set "FUEL_ALLOWED_ORIGINS=$FUEL_ALLOWED_ORIGINS"
      - name: Smoke check (local and remote migrations match)
        run: |
          supabase migration list | tee migrations.txt
          # Rows are "local | remote | time"; a row with a version in only one column is drift.
          bad="$(awk -F'|' '$0 ~ /[0-9]/ && NF >= 3 { l=$1; r=$2; gsub(/[ \t]/, "", l); gsub(/[ \t]/, "", r); if (l != r) print }' migrations.txt)"
          if [ -n "$bad" ]; then
            echo "Migration drift between repo and production:"
            echo "$bad"
            exit 1
          fi
