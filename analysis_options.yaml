include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Infos count as failures in CI (`make lint` uses --fatal-infos).
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/l10n/**"
    - "**/build/**"
    - "**/.dart_tool/**"

linter:
  rules:
    # Packages are internal; public API docs are not required everywhere.
    public_member_api_docs: false
