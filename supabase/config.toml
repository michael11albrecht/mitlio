# Supabase CLI config (CLI version pinned in .github/workflows/db.yml and supabase/README.md).
# Minimal service set: db, auth, rest (api), realtime. Everything else is off until needed.
# `project_id` is the local Docker stack name only; the hosted project ref is
# intentionally absent (agents never `supabase link`, see CLAUDE.md).
project_id = "mitlio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Groups are shared after an anonymous sign-in on first share (plan P6-T07).
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
