name: mitlio
description: mitlio — the private taxometer. Share car rides and group expenses fairly.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  mitlio_domain: any
  path_provider: ^2.1.6
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  # Design-time generators for the launcher icon and native splash (P7-T06);
  # they ship nothing in the app, see docs/brand.md.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Symlink to tool/fixtures/scenarios (single source of seed scenarios).
    - assets/scenarios/
    # Roboto (Apache 2.0, see assets/fonts/Roboto_LICENSE.txt) for the PDF.
    - assets/fonts/
