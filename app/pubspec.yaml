name: mitlio
description: mitlio — the private taxometer. Share car rides and group expenses fairly.
publish_to: none
# Build number comes from CI (--build-number); release-please bumps this line.
version: 0.5.0 # x-release-please-version
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  # Photo picker for the optional feedback screenshots (P7-T10, ADR-29): the
  # system picker, no library permission, no network.
  image_picker: ^1.2.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  material_ui: ^1.1.0
  mitlio_domain: any
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  sentry: ^10.4.0
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  # Design-time generators for the launcher icon and native splash (P7-T06);
  # they ship nothing in the app, see docs/brand.md.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Symlink to tool/fixtures/scenarios (single source of seed scenarios).
    - assets/scenarios/
    # EEA car list for the vehicle form (CC BY 4.0), see docs/car-catalog.md.
    - assets/car_catalog/
    # Roboto (Apache 2.0, see assets/fonts/Roboto_LICENSE.txt) for the PDF.
    - assets/fonts/
