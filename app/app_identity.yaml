# Single source of truth for app identity (ADR-16).
# Consumed by flavors (P8-T01) and fastlane (P8-T02).
name: mitlio
flavors:
  dev:
    display_name: mitlio dev
    bundle_id: app.mitlio.dev
  prod:
    display_name: mitlio
    bundle_id: app.mitlio
url_scheme: mitlio
# ADR-17: own domain (invite links https://mitlio.de/join/<token>).
link_domain: mitlio.de
debug_drive_namespace: ext.mitlio
